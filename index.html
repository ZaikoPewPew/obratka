<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Обратка — закрытое сообщество взаимных ревью портфолио. Живые листы от дизайнеров твоего уровня."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Обратка" />
    <meta property="og:title" content="Обратка — живые ревью портфолио" />
    <meta
      property="og:description"
      content="Обратка — закрытое сообщество взаимных ревью портфолио. Живые листы от дизайнеров твоего уровня."
    />
    <meta property="og:url" content="%SITE_ORIGIN%%SITE_BASE%" />
    <meta
      property="og:image"
      content="%SITE_ORIGIN%%SITE_BASE%assets/og/og-share.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Обратка — живые ревью портфолио" />
    <meta
      name="twitter:description"
      content="Обратка — закрытое сообщество взаимных ревью портфолио. Живые листы от дизайнеров твоего уровня."
    />
    <meta
      name="twitter:image"
      content="%SITE_ORIGIN%%SITE_BASE%assets/og/og-share.png"
    />
    <title>Обратка — живые ревью портфолио</title>
    <link rel="icon" href="/assets/svg/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/fonts.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/entrance.css" />
    <link rel="stylesheet" href="/styles/brand-screen.css" />
  </head>
  <body>
    <main class="iframe-shell" hidden>
      <header
        class="iframe-shell__controls"
        data-i18n-aria="controlsAria"
        aria-label="Управление айфреймом"
      >
        <div class="iframe-shell__actions">
          <button
            type="button"
            class="iframe-shell__btn iframe-shell__btn--icon"
            data-action="frame-back"
            data-i18n-aria="frameBackButton"
            data-i18n-title="frameBackButtonTitle"
            title="Назад"
            disabled
          >
            <svg
              class="iframe-shell__btn-icon"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M8.25 13.5L3.75 9L8.25 4.5M3.75 9H14.25"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="iframe-shell__btn iframe-shell__btn--icon"
            data-action="frame-forward"
            data-i18n-aria="frameForwardButton"
            data-i18n-title="frameForwardButtonTitle"
            title="Вперёд"
            disabled
          >
            <svg
              class="iframe-shell__btn-icon"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M9.75 13.5L14.25 9L9.75 4.5M14.25 9H3.75"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="iframe-shell__btn iframe-shell__btn--icon"
            data-action="reload-frame"
            data-i18n-aria="reloadFrameButton"
            data-i18n-title="reloadFrameButtonTitle"
            title="Обновить фрейм"
            disabled
          >
            <svg
              class="iframe-shell__btn-icon"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M15.7383 4.5V7.5H12.75M15.7383 7.5L13.2426 4.75736C10.8995 2.41421 7.1005 2.41421 4.75736 4.75736C2.41421 7.1005 2.41421 10.8995 4.75736 13.2426C7.1005 15.5858 10.8995 15.5858 13.2426 13.2426C13.8305 12.6547 14.2709 11.9752 14.5638 11.25"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="iframe-shell__rec"
            data-action="toggle-dictation"
            title="Надиктовать заметки"
            hidden
            aria-pressed="false"
          >
            <svg
              class="iframe-shell__rec-mic"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M9 11.25C10.2426 11.25 11.25 10.2426 11.25 9V4.5C11.25 3.25736 10.2426 2.25 9 2.25C7.75736 2.25 6.75 3.25736 6.75 4.5V9C6.75 10.2426 7.75736 11.25 9 11.25Z"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M13.5 8.25V9C13.5 11.4853 11.4853 13.5 9 13.5C6.51472 13.5 4.5 11.4853 4.5 9V8.25M9 13.5V15.75M7.125 15.75H10.875"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="iframe-shell__rec-wave" aria-hidden="true">
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
            </span>
            <span class="iframe-shell__rec-dot" aria-hidden="true"></span>
          </button>
        </div>

        <div
          class="iframe-shell__timer"
          role="timer"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="iframe-shell__timer-value" data-timer>00:00:00</span>
        </div>

        <div class="iframe-shell__person">
          <button
            type="button"
            class="iframe-shell__abort"
            data-action="abort-review"
            data-i18n="reviewAbort"
            data-i18n-aria="reviewAbortAria"
          >Прервать ревью</button>
        </div>
      </header>

      <div class="iframe-shell__workspace" data-workspace>
        <section
          class="iframe-shell__frame"
          data-i18n-aria="frameAria"
          aria-label="Портфолио"
          data-frame
        >
          <iframe
            id="portfolio-frame"
            class="iframe-shell__iframe"
            src="about:blank"
            title="Портфолио"
            data-i18n-title="frameAria"
            loading="eager"
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
          ></iframe>

          <div
            class="iframe-shell__external"
            data-external-viewer
            hidden
            aria-hidden="true"
            data-i18n-aria="embedBlockedAria"
            aria-label="Портфолио откроется в новой вкладке"
          >
            <div class="iframe-shell__external-panel">
              <div class="iframe-shell__external-card">
                <div
                  class="iframe-shell__external-media"
                  data-external-media
                  data-i18n-aria="embedBlockedMediaAria"
                  aria-label="Видео-инструкция"
                ></div>
                <ol class="iframe-shell__external-steps">
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M12 3V6M12 21V18M4.20577 16.5L6.80385 15M21 12H18M16.5 19.7942L15 17.1962M3 12H6M7.5 4.20577L9 6.80385M7.5 19.7942L9 17.1962M19.7942 16.5L17.1962 15M4.20577 7.5L6.80385 9"
                          stroke="currentColor"
                          stroke-width="1.02"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep1Title"
                      >Нажми «Открыть и начать»</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep1Body"
                      >Портфолио откроется в новой вкладке</span>
                    </span>
                  </li>
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M12 6.5V4C16.4183 4 20 7.58172 20 12C20 16.4183 16.4183 20 12 20C7.58172 20 4 16.4183 4 12C4 9.79086 4.89543 7.79086 6.34315 6.34315M12 12L9 9"
                          stroke="currentColor"
                          stroke-width="1.02"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep2Title"
                      >Изучи портфолио</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep2Body"
                      >Таймер начнёт отсчёт автоматически</span>
                    </span>
                  </li>
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M13 17C13 18.6569 11.6569 20 10 20C8.34315 20 7 18.6569 7 17C7 15.3431 8.34315 14 10 14C11.6569 14 13 15.3431 13 17ZM13 17V6M13 6V4H17V6H13Z"
                          stroke="currentColor"
                          stroke-width="1.02"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep3Title"
                      >Дождись сигнала</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep3Body"
                      >Когда время закончится, ты услышишь звук</span>
                    </span>
                  </li>
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M3 11H13M3 7H13M3 15H9M12.9315 15.3314L15.4929 17.8929C15.8834 18.2834 16.5166 18.2834 16.9071 17.8929L21.641 13.159"
                          stroke="currentColor"
                          stroke-width="1.02"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep4Title"
                      >Пройди опрос</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep4Body"
                      >Вернись и ответь на несколько вопросов</span>
                    </span>
                  </li>
                </ol>
              </div>
              <button
                type="button"
                class="iframe-shell__external-open"
                data-action="open-external"
                data-i18n="embedBlockedOpen"
              >Открыть и начать</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
