<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Обратка</title>
    <link rel="icon" href="/assets/svg/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/fonts.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/entrance.css" />
    <link rel="stylesheet" href="/styles/app-modal.css" />
    <link rel="stylesheet" href="/styles/side-panel.css" />
    <link rel="stylesheet" href="/styles/iframe-shell.css" />
    <link rel="stylesheet" href="/styles/success-screen.css" />
    <link rel="stylesheet" href="/styles/report-screen.css" />
    <link rel="stylesheet" href="/styles/ban-screen.css" />
    <link rel="stylesheet" href="/styles/home-screen.css" />
    <link rel="stylesheet" href="/styles/legendary-online-panel.css" />
    <link rel="stylesheet" href="/styles/feedback.css" />
    <link rel="stylesheet" href="/styles/tabs-panel.css" />
    <link rel="stylesheet" href="/styles/account-menu.css" />
    <link rel="stylesheet" href="/styles/settings-screen.css" />
  </head>
  <body>
    <main class="iframe-shell" hidden>
      <header
        class="iframe-shell__controls"
        data-i18n-aria="controlsAria"
        aria-label="Управление айфреймом"
      >
        <div class="iframe-shell__actions">
          <button
            type="button"
            class="iframe-shell__btn iframe-shell__btn--icon"
            data-action="frame-back"
            data-i18n-aria="frameBackButton"
            data-i18n-title="frameBackButtonTitle"
            title="Назад"
          >
            <svg
              class="iframe-shell__btn-icon"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M8.25 13.5L3.75 9L8.25 4.5M3.75 9H14.25"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="iframe-shell__btn iframe-shell__btn--icon"
            data-action="frame-forward"
            data-i18n-aria="frameForwardButton"
            data-i18n-title="frameForwardButtonTitle"
            title="Вперёд"
          >
            <svg
              class="iframe-shell__btn-icon"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M9.75 13.5L14.25 9L9.75 4.5M14.25 9H3.75"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="iframe-shell__btn iframe-shell__btn--icon"
            data-action="reload-frame"
            data-i18n-aria="reloadFrameButton"
            data-i18n-title="reloadFrameButtonTitle"
            title="Обновить фрейм"
          >
            <svg
              class="iframe-shell__btn-icon"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M15.7383 4.5V7.5H12.75M15.7383 7.5L13.2426 4.75736C10.8995 2.41421 7.1005 2.41421 4.75736 4.75736C2.41421 7.1005 2.41421 10.8995 4.75736 13.2426C7.1005 15.5858 10.8995 15.5858 13.2426 13.2426C13.8305 12.6547 14.2709 11.9752 14.5638 11.25"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="iframe-shell__rec"
            data-action="toggle-dictation"
            title="Надиктовать заметки"
            hidden
            aria-pressed="false"
          >
            <svg
              class="iframe-shell__rec-mic"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M9 11.25C10.2426 11.25 11.25 10.2426 11.25 9V4.5C11.25 3.25736 10.2426 2.25 9 2.25C7.75736 2.25 6.75 3.25736 6.75 4.5V9C6.75 10.2426 7.75736 11.25 9 11.25Z"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M13.5 8.25V9C13.5 11.4853 11.4853 13.5 9 13.5C6.51472 13.5 4.5 11.4853 4.5 9V8.25M9 13.5V15.75M7.125 15.75H10.875"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="iframe-shell__rec-wave" aria-hidden="true">
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
              <span class="iframe-shell__rec-bar"></span>
            </span>
            <span class="iframe-shell__rec-dot" aria-hidden="true"></span>
          </button>
        </div>

        <div
          class="iframe-shell__timer"
          role="timer"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="iframe-shell__timer-value" data-timer>00:00:00</span>
        </div>

        <div class="iframe-shell__person">
          <button
            type="button"
            class="iframe-shell__abort"
            data-action="abort-review"
            data-i18n="reviewAbort"
            data-i18n-aria="reviewAbortAria"
          >Прервать ревью</button>
        </div>
      </header>

      <div class="iframe-shell__workspace" data-workspace>
        <section
          class="iframe-shell__frame"
          data-i18n-aria="frameAria"
          aria-label="Портфолио"
          data-frame
        >
          <iframe
            id="portfolio-frame"
            class="iframe-shell__iframe"
            src="about:blank"
            title="Портфолио"
            data-i18n-title="frameAria"
            loading="eager"
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
          ></iframe>

          <div
            class="iframe-shell__external"
            data-external-viewer
            hidden
            aria-hidden="true"
            data-i18n-aria="embedBlockedAria"
            aria-label="Портфолио откроется в новой вкладке"
          >
            <div class="iframe-shell__external-panel">
              <div class="iframe-shell__external-card">
                <div
                  class="iframe-shell__external-media"
                  data-external-media
                  data-i18n-aria="embedBlockedMediaAria"
                  aria-label="Видео-инструкция"
                ></div>
                <ol class="iframe-shell__external-steps">
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 17.3 18.3"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M2.65 8.65C2.65 11.9637 5.33629 14.65 8.65 14.65M8.65 14.65V17.65M8.65 14.65C10.0521 14.65 11.3418 14.1691 12.3633 13.3633M14.65 8.65C14.65 9.27186 14.5554 9.87161 14.3798 10.4357M0.65 1.65L6.65 7.65M16.65 17.65L12.3633 13.3633M6.65 7.65V8.65C6.65 9.75457 7.54543 10.65 8.65 10.65H9.65M6.65 7.65L9.65 10.65M9.65 10.65L12.3633 13.3633M10.65 6.65V2.65C10.65 1.54543 9.75457 0.65 8.65 0.65C7.54543 0.65 6.65 1.54543 6.65 2.65V3.15"
                          stroke="currentColor"
                          stroke-width="1.3"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep1Title"
                      >Нажми «Открыть и начать»</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep1Body"
                      >Портфолио откроется в новой вкладке</span>
                    </span>
                  </li>
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 17.3 17.3"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M8.65 3.15V0.65C13.0683 0.65 16.65 4.23172 16.65 8.65C16.65 13.0683 13.0683 16.65 8.65 16.65C4.23172 16.65 0.65 13.0683 0.65 8.65C0.65 6.44086 1.54543 4.44086 2.99315 2.99315M8.65 8.65L5.65 5.65"
                          stroke="currentColor"
                          stroke-width="1.3"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep2Title"
                      >Изучи портфолио</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep2Body"
                      >Таймер начнёт отсчёт автоматически</span>
                    </span>
                  </li>
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 11.3 17.3"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M6.65 13.65C6.65 15.3069 5.30685 16.65 3.65 16.65C1.99315 16.65 0.65 15.3069 0.65 13.65C0.65 11.9931 1.99315 10.65 3.65 10.65C5.30685 10.65 6.65 11.9931 6.65 13.65ZM6.65 13.65V2.65M6.65 2.65V0.65H10.65V2.65H6.65Z"
                          stroke="currentColor"
                          stroke-width="1.3"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep3Title"
                      >Дождись сигнала</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep3Body"
                      >Когда время закончится, ты услышишь звук</span>
                    </span>
                  </li>
                  <li class="iframe-shell__external-step">
                    <span
                      class="iframe-shell__external-step-icon"
                      aria-hidden="true"
                    >
                      <svg
                        class="iframe-shell__external-step-glyph"
                        width="24"
                        height="24"
                        viewBox="0 0 19.941 12.4858"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M0.65 4.65H10.65M0.65 0.65H10.65M0.65 8.65H6.65M10.5815 8.98143L13.1429 11.5429C13.5334 11.9334 14.1666 11.9334 14.5571 11.5429L19.291 6.80903"
                          stroke="currentColor"
                          stroke-width="1.3"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span class="iframe-shell__external-step-copy">
                      <span
                        class="iframe-shell__external-step-title"
                        data-i18n="embedBlockedStep4Title"
                      >Пройди опрос</span>
                      <span
                        class="iframe-shell__external-step-body"
                        data-i18n="embedBlockedStep4Body"
                      >Вернись и ответь на несколько вопросов</span>
                    </span>
                  </li>
                </ol>
              </div>
              <button
                type="button"
                class="iframe-shell__external-open"
                data-action="open-external"
                data-i18n="embedBlockedOpen"
              >Открыть и начать</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
